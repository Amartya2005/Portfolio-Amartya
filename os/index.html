<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AmartyaOS – Interactive portfolio of Amartya Sarangee</title>
  <meta name="description" content="Amartya Sarangee's portfolio as a retro desktop: FocusTag, projects with engineering notes, experience, certificates, skills and a working terminal.">
  <meta name="author" content="Amartya Sarangee">
  <meta name="robots" content="index, follow, max-image-preview:large">
  <link rel="canonical" href="https://amartya.focustriggerautomation.com/os/">
  <meta name="theme-color" content="#161b3a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Amartya Sarangee">
  <meta property="og:url" content="https://amartya.focustriggerautomation.com/os/">
  <meta property="og:title" content="AmartyaOS – Interactive portfolio of Amartya Sarangee">
  <meta property="og:description" content="A retro desktop with my projects, experience, certificates and a working terminal.">
  <meta property="og:image" content="https://amartya.focustriggerautomation.com/images/preview.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <template id="ph-jsonld"></template>
  <link rel="icon" href="/images/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Jersey+10&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="os.css">
</head>
<body>
  <div id="boot" class="boot" aria-live="polite">
    <div class="boot__log" id="boot-log"></div>
    <p class="boot__skip">click or press any key to skip</p>
  </div>

  <main id="desktop" class="desktop" aria-label="AmartyaOS desktop">
    <section class="widget" id="widget" aria-label="Profile"></section>
    <nav class="icons" id="icons" aria-label="Applications"></nav>
    <div class="windows" id="windows"></div>
  </main>

  <div id="start-menu" class="start-menu" hidden></div>

  <footer class="taskbar" id="taskbar">
    <button class="start-btn" id="start-btn" type="button" aria-haspopup="true" aria-expanded="false">
      <span class="start-btn__logo" aria-hidden="true">AS</span><span>Start</span>
    </button>
    <button class="home-btn" id="home-btn" type="button" aria-label="Home screen">Home</button>
    <div class="tasks" id="tasks" role="toolbar" aria-label="Open windows"></div>
    <div class="tray">
      <time class="tray__clock" id="clock">--:--</time>
    </div>
  </footer>

  <noscript>
    <div class="noscript">
      <h1>Amartya Sarangee</h1>
      <p>Co-Founder &amp; Director, FocusTrigger Automation · Building FocusTag</p>
      <p><a href="mailto:amartyasarangee@focustriggerautomation.com">amartyasarangee@focustriggerautomation.com</a> ·
        <a href="https://www.linkedin.com/in/amartya-sarangee-3351a8241">LinkedIn</a> ·
        <a href="https://github.com/Amartya2005">GitHub</a></p>
    </div>
  </noscript>

  <script src="data.js"></script>
  <script src="os.js"></script>
</body>
</html>

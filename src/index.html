<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <style>
    body {
      background-color: rgb(0, 0, 0);
      margin: 0;
    }

    #webgl {
      pointer-events: none;
    }

    #ui-app {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }

    #ui {
      position: absolute;
      overflow: hidden;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }

    #monitor-videos {
      pointer-events: none;
      position: 'absolute';
      opacity: 0;
      width: 0;
      height: 0;
      top: 0;
      left: 0;

    }

    #css {
      cursor: pointer;
    }

    #ui-interactive {
      position: absolute;
      top: 0;
      left: 0;
      width: 256px;
    }

    video {
      position: absolute;
      top: 0;
      pointer-events: none;
    }
  </style>

  <!-- Primary Meta Tags -->
  <title>Amartya Sarangee – Software Engineer &amp; FocusTrigger Co-Founder</title>
  <meta name="description"
    content="Software engineer and Co-Founder &amp; Director of FocusTrigger Automation, building FocusTag. CS student at GIET University: backend, applied AI and agentic AI.">
  <meta name="author" content="Amartya Sarangee">
  <meta name="robots" content="index, follow, max-image-preview:large">
  <link rel="canonical" href="https://portfolio-amartya.vercel.app/">
  <meta name="theme-color" content="#f6f0e4" media="(max-width: 767px)">
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="/site.webmanifest">

  <!-- Open Graph -->
  <meta property="og:type" content="profile">
  <meta property="og:site_name" content="Amartya Sarangee">
  <meta property="og:url" content="https://portfolio-amartya.vercel.app/">
  <meta property="og:title" content="Amartya Sarangee – Software Engineer &amp; FocusTrigger Co-Founder">
  <meta property="og:description"
    content="Co-Founder &amp; Director at FocusTrigger Automation, building FocusTag. Backend, applied AI and agentic systems. Explore my portfolio as a 3D desk or a retro OS.">

  <link rel="icon" href="/images/favicon.ico" sizes="any">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="/home.css">
  <script>
    // Decide before first paint: phones get the fast text home page, others the 3D desk.
    (function () {
      var q = location.search;
      var three = /[?&]3d\b/.test(q) || (!/[?&]text\b/.test(q) && !window.matchMedia('(max-width: 767px)').matches);
      document.documentElement.className = three ? 'is-3d' : 'is-home';
    })();
  </script>
  <template id="ph-jsonld"></template>
</head>

<body>
  <template id="ph-home"></template>
  <div id="css"></div>
  <div id="webgl"></div>

</body>
